# A -> B 데이터 명세 3장·7장. 계산 기간 숫자는 여기 두고 컬럼 이름에는 넣지 않는다.
# 2026-10-09: start_date를 2019-01-01로 당김(워크포워드 w1 학습 시작일 2019-01-02와
# 일치). 2019-01-01은 휴장일이라 실제 첫 행은 2019-01-02가 된다. adj_close는
# 이 날짜를 100으로 재기준한다(2.3절 리베이스 로직 그대로, 날짜만 바뀜).
start_date: "2019-01-01"
# fetch_buffer_start는 그대로 둔다 — start_date보다 1년+ 앞서 있어서 RSI(14)/
# MACD(26)/변동성(20) 전부 start_date 시점에 이미 충분히 워밍업돼 있다(NaN 0 확인함).
fetch_buffer_start: "2017-12-01"

indicators:
  rsi:
    window: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  volatility:
    window: 20

features: [log_return, rsi, macd, volatility]

normalization:
  clip: 5.0   # ±5 자르기는 B(옵저베이션 생성기)가 한다 — 여기는 기록용 문서화
